name: conwi_inventory
description: conwiInventory mobile app (POS, inventory, sales, estores)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo-mark.png
